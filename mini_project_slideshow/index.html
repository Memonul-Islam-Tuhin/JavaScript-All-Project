<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=7" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="Memonul Islam Tuhin" />
    <link
      rel="shortcut icon"
      href="./images/presentation.png"
      type="image/x-icon"
    />
    <title>Slide Show</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./src/output.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>

  <body class="bg-green-500">
    <div class="flex items-center justify-center h-screen gap-10">
      <!-- Heading -->
      <div class="text-center">
        <h1 class="text-5xl font-bold text-white uppercase tracking-wider">
          Sports Slide Show
        </h1>
        <p class="mt-3 text-white/80 text-lg animate-glow">
          Simple Slide Show Using HTML, Tailwind CSS & JavaScript
        </p>
      </div>
      <div
        class="relative w-80 h-60 bg-white rounded-xl shadow-xl flex items-center justify-center overflow-hidden"
      >
        <!-- Football -->
        <div
          class="slideshow-element current absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 opacity-100 scale-100"
        >
          <i class="fas fa-futbol text-6xl text-orange-500"></i>
          <h2 class="mt-4 text-3xl font-bold text-orange-500">Football</h2>
        </div>

        <!-- Volleyball -->
        <div
          class="slideshow-element absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 opacity-0 scale-95 pointer-events-none"
        >
          <i class="fas fa-volleyball-ball text-6xl text-blue-500"></i>
          <h2 class="mt-4 text-3xl font-bold text-blue-500">Volleyball</h2>
        </div>

        <!-- Swimming -->
        <div
          class="slideshow-element absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 opacity-0 scale-95 pointer-events-none"
        >
          <i class="fas fa-swimmer text-6xl text-cyan-500"></i>
          <h2 class="mt-4 text-3xl font-bold text-cyan-500">Swimming</h2>
        </div>

        <!-- Basketball -->
        <div
          class="slideshow-element absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 opacity-0 scale-95 pointer-events-none"
        >
          <i class="fas fa-basketball-ball text-6xl text-red-500"></i>
          <h2 class="mt-4 text-3xl font-bold text-red-500">Basketball</h2>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
